<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APi Practise</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <main>
        
        <form id="userForm" class="w-96 mx-auto mt-10 space-y-4" enctype="multipart/form-data">
            <input type="text" id="username" placeholder="Username" class="w-full border p-2 rounded" required />

            <input type="text" id="first_name" placeholder="First Name" class="w-full border p-2 rounded" required />

            <input type="text" id="last_name" placeholder="Last Name" class="w-full border p-2 rounded" required />

            <input type="email" id="email" placeholder="Email Address" class="w-full border p-2 rounded" required />

            <input type="password" id="password" placeholder="Password" class="w-full border p-2 rounded" required />

            <input type="password" id="confirm_password" placeholder="Confirm Password"
                class="w-full border p-2 rounded" required />

            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Create Account</button>
            
        </form>
    </main>
    
     <script src="practise.js"></script>
</body>

</html>
